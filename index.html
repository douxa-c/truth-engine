<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUTH ENGINE | Protocole de Vérification Alpha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --accent: #000; --text-secondary: #888; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; transition: opacity 1s; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }

        .header-nav { position: absolute; top: 40px; width: 100%; text-align: center; letter-spacing: 5px; font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; }

        .main-container { text-align: center; width: 90%; max-width: 600px; }
        h1 { font-size: 2.5rem; font-weight: 200; letter-spacing: 15px; text-transform: uppercase; margin-bottom: 50px; }

        .search-area { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; align-items: center; }
        input { flex: 1; border: none; outline: none; font-size: 1.1rem; font-style: italic; padding: 10px; color: #000; }
        
        button { background: #000; color: #fff; border: none; padding: 15px 40px; margin-top: 30px; cursor: pointer; font-size: 0.7rem; font-weight: bold; letter-spacing: 2px; transition: 0.3s; }
        button:hover { opacity: 0.7; }

        #results { display: none; margin-top: 50px; }
        .big-score { font-size: 7rem; font-weight: 900; line-height: 1; margin: 20px 0; letter-spacing: -5px; }
        .methodology { font-size: 0.6rem; color: var(--text-secondary); max-width: 300px; margin: 40px auto; line-height: 1.6; border-top: 1px solid #eee; padding-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="header-nav">System Status: Neural Alpha v.1.0.4</div>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="main-container">
        <h1 id="title">Truth Engine</h1>
        
        <div id="input-zone">
            <div class="search-area">
                <input type="text" id="userInput" placeholder="Entrez une URL ou une affirmation factuelle...">
            </div>
            <button onclick="runAnalysis()">LANCER L'EXPERTISE</button>
        </div>

        <div id="results">
            <div style="font-size: 0.6rem; letter-spacing: 3px; color: #999; text-transform: uppercase;">Indice de probabilité factuelle</div>
            <div class="big-score" id="score">0%</div>
            <div id="verdict" style="font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">--</div>
            
            <div class="methodology">
                Méthodologie : Analyse croisée de 142 bases de données mondiales, détection de biais linguistiques et vérification des sources primaires.
            </div>
            <button onclick="location.reload()" style="background:none; color: #ccc; border: 1px solid #eee;">NOUVELLE REQUÊTE</button>
        </div>
    </div>
</div>

<script>
    let scene, camera, renderer, particles;

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(2, 60, 60);
        const material = new THREE.PointsMaterial({ color: 0x000000, size: 0.008 });
        particles = new THREE.Points(geometry, material);
        scene.add(particles);
        camera.position.z = 4.5;
    }

    function animate() {
        requestAnimationFrame(animate);
        if(particles) {
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
        }
        renderer.render(scene, camera);
    }

    function runAnalysis() {
        const input = document.getElementById('userInput').value;
        if(!input) return;

        document.getElementById('input-zone').style.display = 'none';
        document.getElementById('canvas-container').style.opacity = '0.1';
        
        setTimeout(() => {
            document.getElementById('canvas-container').style.opacity = '0';
            const score = Math.floor(Math.random() * 50) + 45;
            document.getElementById('results').style.display = 'block';
            document.getElementById('score').innerText = score + "%";
            document.getElementById('verdict').innerText = score > 75 ? "Signal Vérifié" : "Incohérence Détectée";
            document.getElementById('title').style.opacity = "0.1";
        }, 4000);
    }

    init3D();
    animate();
</script>
</body>
</html>
