<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUTH ENGINE | SYSTEM V5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* Le Globe est caché au début */
        #canvas-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; 
            opacity: 0; transition: opacity 1s ease; pointer-events: none;
        }
        
        #ui-layer {
            position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100vh;
        }

        .main-box {
            text-align: center; width: 90%; max-width: 450px; color: white;
        }

        h1 { letter-spacing: 15px; font-weight: 100; margin-bottom: 30px; transition: 0.5s; }

        input {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            color: white; padding: 15px; font-family: monospace; text-align: center; outline: none; font-size: 1rem;
        }

        button {
            margin-top: 40px; background: none; color: white; border: 1px solid white;
            padding: 12px 40px; cursor: pointer; letter-spacing: 5px; font-size: 0.8rem; transition: 0.3s;
        }

        button:hover { background: white; color: black; }

        /* Zone de résultat */
        #result-display { margin-top: 50px; display: none; }
        .score { font-size: 6rem; font-weight: bold; margin: 0; letter-spacing: -5px; }
        .label { letter-spacing: 10px; font-size: 0.7rem; color: #666; text-transform: uppercase; }

        /* Animation de scan */
        .scanning-text { font-size: 0.7rem; letter-spacing: 3px; color: white; margin-top: 20px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="main-box" id="ui-content">
        <h1 id="title">TRUTH</h1>
        
        <div id="input-zone">
            <input type="text" id="userInput" placeholder="ENTRER DONNÉES...">
            <br>
            <button onclick="startAnalysis()">ANALYSER</button>
        </div>

        <div id="scanning-zone" style="display:none;">
            <div class="scanning-text">SCAN NEURONAL EN COURS...</div>
        </div>

        <div id="result-display">
            <div class="label">Fiabilité du signal</div>
            <div class="score" id="final-score">00%</div>
            <div class="label" id="final-verdict" style="margin-top:10px; color:white;">--</div>
            <br>
            <button onclick="location.reload()" style="font-size:0.5rem; padding:5px 15px;">NOUVEAU SCAN</button>
        </div>
    </div>
</div>

<script>
    let scene, camera, renderer, particles;
    
    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // On crée un globe de particules BLANC
        const geometry = new THREE.SphereGeometry(2, 40, 40);
        const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.015 });
        particles = new THREE.Points(geometry, material);
        scene.add(particles);
        camera.position.z = 5;
    }

    function animate() {
        requestAnimationFrame(animate);
        if(particles) {
            particles.rotation.y += 0.005;
            particles.rotation.x += 0.002;
        }
        renderer.render(scene, camera);
    }

    function startAnalysis() {
        const val = document.getElementById('userInput').value;
        if(!val) return;

        // 1. Cacher l'input, montrer le globe
        document.getElementById('input-zone').style.display = 'none';
        document.getElementById('scanning-zone').style.display = 'block';
        document.getElementById('canvas-container').style.opacity = '1';
        document.getElementById('title').style.letterSpacing = '25px';

        // 2. Simuler l'analyse (3 secondes)
        setTimeout(() => {
            // Cacher le globe
            document.getElementById('canvas-container').style.opacity = '0';
            document.getElementById('scanning-zone').style.display = 'none';
            
            // Calcul du score
            const score = Math.floor(Math.random() * 60) + 40;
            
            // Afficher le résultat final en BLANC
            document.getElementById('result-display').style.display = 'block';
            document.getElementById('final-score').innerText = score + "%";
            document.getElementById('final-verdict').innerText = score > 75 ? "VÉRITÉ CONFIRMÉE" : "ALERTE MANIPULATION";
            document.getElementById('title').style.opacity = '0.2';
        }, 3500);
    }

    init3D();
    animate();
</script>

</body>
</html>
