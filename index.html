<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUTH ENGINE | Intelligence Artificielle</title>
    <style>
        :root { --glow-color: #00ff41; }
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        /* Effet de grille en arrière-plan pour le look tech */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg);
            bottom: -50%;
        }
        .container {
            text-align: center;
            background: rgba(10, 10, 10, 0.8);
            padding: 60px;
            border: 1px solid #222;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 20px rgba(0,255,65,0.05);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 10px;
            margin-bottom: 5px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--glow-color);
            font-size: 0.7rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--glow-color);
            box-shadow: 0 0 15px rgba(0,255,65,0.2);
        }
        button {
            width: 100%;
            padding: 15px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        button:hover {
            background: var(--glow-color);
            transform: scale(1.02);
        }
        #result-box {
            margin-top: 30px;
            min-height: 50px;
            border-top: 1px dashed #333;
            padding-top: 20px;
        }
        .loading-bar {
            width: 0%;
            height: 2px;
            background: var(--glow-color);
            box-shadow: 0 0 10px var(--glow-color);
            transition: width 1.5s ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TRUTH</h1>
    <div class="subtitle">Neural Fact-Checking System</div>
    
    <div class="input-group">
        <input type="text" id="inputClaim" placeholder="ENTREZ UNE AFFIRMATION OU URL...">
    </div>
    
    <button onclick="analyze()">DÉCRYPTER LA VÉRITÉ</button>
    
    <div id="result-box">
        <div id="loading" style="display:none;">
            <div style="font-size: 0.7rem; color: #666; margin-bottom: 5px;">ANALYSE NEURONALE...</div>
            <div class="loading-bar" id="bar"></div>
        </div>
        <div id="content" style="color: #666; font-size: 0.8rem;">SYSTÈME PRÊT : EN ATTENTE DE DONNÉES</div>
    </div>
</div>

<script>
    function analyze() {
        const claim = document.getElementById('inputClaim').value;
        if(!claim) return;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('content').style.display = 'none';
        document.getElementById('bar').style.width = '100%';

        setTimeout(() => {
            let score = Math.floor(Math.random() * (99 - 40) + 40);
            let color = score > 75 ? '#00ff41' : (score > 50 ? '#ffcc00' : '#ff3300');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('content').innerHTML = `
                <div style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">RÉSULTAT DE L'ANALYSE :</div>
                <div style="font-size: 3rem; color: ${color}; font-weight: bold; text-shadow: 0 0 20px ${color}33;">${score}%</div>
                <div style="margin-top: 10px; letter-spacing: 1px;">VERDICT : <strong>${score > 75 ? 'VÉRITÉ CONFIRMÉE' : (score > 50 ? 'PARTIELLEMENT VRAI' : 'ALERTE MANIPULATION')}</strong></div>
            `;
        }, 2000);
    }
</script>

</body>
</html>
