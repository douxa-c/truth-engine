<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUTH ENGINE | WHITE EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        #canvas-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; 
            opacity: 0; transition: opacity 0.8s ease; pointer-events: none;
        }
        
        #ui-layer {
            position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100vh;
        }

        .main-box {
            text-align: center; width: 90%; max-width: 500px; color: #000;
        }

        h1 { letter-spacing: 20px; font-weight: 200; margin-bottom: 40px; text-transform: uppercase; color: #000; }

        .input-wrapper { border-bottom: 2px solid #000; margin-bottom: 30px; }

        input {
            width: 100%; background: transparent; border: none;
            color: #000; padding: 15px; font-family: serif; text-align: center; outline: none; font-size: 1.2rem; font-style: italic;
        }

        button {
            margin-top: 20px; background: #000; color: #fff; border: none;
            padding: 15px 50px; cursor: pointer; letter-spacing: 4px; font-size: 0.7rem; font-weight: bold; transition: 0.3s;
        }

        button:hover { background: #333; transform: scale(1.05); }

        #result-display { margin-top: 50px; display: none; animation: slideUp 1s ease; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .score { font-size: 8rem; font-weight: 900; margin: 0; letter-spacing: -8px; line-height: 1; color: #000; }
        .label { letter-spacing: 8px; font-size: 0.6rem; color: #999; text-transform: uppercase; margin-top: 10px; }
        .verdict-text { font-size: 1.2rem; font-weight: bold; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; }

        .status-msg { font-size: 0.6rem; letter-spacing: 2px; color: #ccc; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="main-box">
        <h1 id="title">Truth Engine</h1>
        
        <div id="input-zone">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Saisir la donnée à vérifier...">
            </div>
            <button onclick="startAnalysis()">Lancer l'expertise</button>
        </div>

        <div id="scanning-zone" style="display:none;">
            <div class="status-msg">Calcul des probabilités factuelles...</div>
        </div>

        <div id="result-display">
            <div class="label">Indice de confiance</div>
            <div class="score" id="final-score">00%</div>
            <div class="verdict-text" id="final-verdict">--</div>
            <button onclick="location.reload()" style="background:none; color:#999; border:1px solid #eee; margin-top:40px; padding:10px 20px;">Nouvelle requête</button>
        </div>
    </div>
</div>

<script>
    let scene, camera, renderer, particles;
    
    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // GLOBE DE PARTICULES NOIR (Contrastant avec le fond blanc)
        const geometry = new THREE.SphereGeometry(2, 50, 50);
        const material = new THREE.PointsMaterial({ color: 0x000000, size: 0.012 });
        particles = new THREE.Points(geometry, material);
        scene.add(particles);
        camera.position.z = 5;
    }

    function animate() {
        requestAnimationFrame(animate);
        if(particles) {
            particles.rotation.y += 0.003;
            particles.rotation.z += 0.001;
        }
        renderer.render(scene, camera);
    }

    function startAnalysis() {
        const val = document.getElementById('userInput').value;
        if(!val) return;

        document.getElementById('input-zone').style.display = 'none';
        document.getElementById('scanning-zone').style.display = 'block';
        document.getElementById('canvas-container').style.opacity = '0.15'; // Globe noir subtil
        document.getElementById('title').style.opacity = '0.1';

        setTimeout(() => {
            document.getElementById('canvas-container').style.opacity = '0';
            document.getElementById('scanning-zone').style.display = 'none';
            
            const score = Math.floor(Math.random() * 65) + 35;
            
            document.getElementById('result-display').style.display = 'block';
            document.getElementById('final-score').innerText = score + "%";
            document.getElementById('final-verdict').innerText = score > 75 ? "Information Certifiée" : "Divergence Détectée";
            document.getElementById('title').style.display = 'none';
        }, 4000);
    }

    init3D();
    animate();
</script>

</body>
</html>
